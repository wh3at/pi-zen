name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # pi の grep/find は rg / fd バイナリを必要とする。フィクスチャは --offline で
      # 自動ダウンロードを禁止しているため、runner に先に入れておく必要がある
      - run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
